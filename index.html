<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Abra quando...</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffafa;color:#49343c;font-family:Arial,sans-serif}.container{max-width:850px;margin:auto;padding:35px 18px}.head{text-align:center;margin-bottom:28px}.tiny{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8d7079}.head h1{font:500 34px Georgia,serif;margin:8px 0}.subtitle{color:#8d7079;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{border:1px solid #efdce2;background:#fff;border-radius:18px;padding:17px;text-align:left;cursor:pointer;transition:.2s;min-height:110px;color:#49343c}.card:hover{transform:translateY(-3px);box-shadow:0 8px 25px #6d39451a}.emoji{font-size:27px}.card strong{display:block;font:500 17px Georgia,serif;margin-top:8px}.card span{display:block;color:#8d7079;font-size:12px;margin-top:5px}.locked-wrap{margin-top:28px;padding-top:25px;border-top:1px solid #efdce2}.locked{width:100%;border:1px solid #e5cbd4;background:linear-gradient(145deg,#fff8fa,#f9edf1);border-radius:22px;padding:23px;text-align:center;cursor:pointer;color:#49343c}.locked h2{font:500 21px Georgia,serif;margin:8px 0 5px}.locked p{font-size:12px;color:#8d7079;margin:0}.lock-icon{font-size:35px}.seal{display:inline-flex;margin-top:14px;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;background:#efd7df;color:#8e596c}.hint{text-align:center;color:#8d7079;font-size:12px;margin-top:22px}.overlay{display:none;position:fixed;inset:0;background:#37232a66;z-index:100;padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fffaf9;border-radius:24px;padding:28px;box-shadow:0 18px 60px #32192333;position:relative}.close{position:absolute;right:14px;top:12px;border:0;background:#f7e8ed;border-radius:50%;width:38px;height:38px;font-size:21px;color:#49343c;cursor:pointer}.modal-emoji{text-align:center;font-size:40px}.modal h2{text-align:center;font:500 25px Georgia,serif;margin:8px 35px 20px}.message{font:15px/1.8 Georgia,serif;color:#5b454d;white-space:pre-line}.signature{text-align:right;margin-top:22px;color:#d88fa8;font:italic 16px Georgia,serif}@media(max-width:520px){.grid{grid-template-columns:1fr}.container{padding:28px 14px}.modal{padding:24px 20px}}
</style></head><body>
<main class="container"><div class="head"><div class="tiny">Uma pequena parte de nós</div><h1>Abra quando...</h1><div class="subtitle">Algumas cartas para dias diferentes. ❤️</div></div><div class="grid" id="grid"></div><div class="locked-wrap"><button class="locked" id="future" type="button"><div class="lock-icon">🔒</div><h2>Não abra ainda</h2><p>Esta carta pertence a uma versão futura de nós.</p><div class="seal">♡</div></button></div><div class="hint">Algumas palavras foram feitas para chegar exatamente quando forem necessárias.</div></main>
<div class="overlay" id="overlay"><div class="modal"><button class="close" id="close" type="button">×</button><div class="modal-emoji" id="emoji"></div><h2 id="title"></h2><div class="message" id="message"></div><div class="signature">Com amor, sempre. ❤️</div></div></div>
<script>
const letters=[
['💗','Abra quando estiver com saudade de mim',`Se você abriu essa carta, provavelmente está sentindo aquela vontade de me ter pertinho. Então, mesmo que eu não possa estar aí agora, quero que você lembre de uma coisa: a distância nunca muda o lugar que você ocupa em mim.\n\nFeche os olhos por um instante e imagine meu abraço. Imagine eu dizendo que vai ficar tudo bem. E lembra de todos os momentos em que a saudade passou porque nós nos encontramos de novo.\n\nAté lá, guarda meu carinho com você. Eu também vou estar sentindo sua falta.`],
['🌧️','Abra quando estiver triste',`Eu queria poder estar aí agora, te abraçar e não precisar dizer absolutamente nada. Só ficar perto de você até esse peso diminuir.\n\nMas, como não posso fazer isso neste instante, quero te lembrar: você não precisa estar bem o tempo todo. Pode existir um dia ruim sem que sua vida seja ruim. Pode existir uma fase difícil sem que ela seja o fim da história.\n\nRespira. Descansa. Chora se precisar. E depois lembra que amanhã é outro dia. Você é muito mais do que aquilo que está sentindo agora.`],
['🪞','Abra quando estiver se comparando',`Por favor, não use a vida de outra pessoa como régua para medir a sua. Você não precisa parecer com ninguém, viver no mesmo ritmo que ninguém ou ter as mesmas conquistas para continuar sendo você.\n\nEu não escolhi uma versão perfeita de você. Eu gosto de você por quem você é, inclusive pelas partes que você ainda está aprendendo a amar.\n\nEntão, quando olhar para outra pessoa e pensar “eu queria ser assim”, lembra de olhar para você também e pensar: “mas existe uma pessoa aqui que é única e que merece ser amada exatamente como é”.`],
['🥺','Abra quando achar que não é suficiente',`Se algum dia sua cabeça tentar convencer você de que não é suficiente, eu quero que você pare por um instante.\n\nVocê não precisa fazer mais, ser mais bonita, mais inteligente, mais forte ou mais perfeita para merecer amor. Você já é alguém que eu admiro, amo e quero ver feliz.\n\nNão deixe um dia de insegurança apagar tudo aquilo que você é. E quando você não conseguir enxergar isso sozinha, lembra que eu enxergo.`],
['😴','Abra quando estiver cansada',`Você pode descansar. De verdade.\n\nNem tudo precisa ser resolvido hoje. Nem todas as respostas precisam aparecer agora. Você não precisa carregar o mundo nas costas só porque se acostumou a ser forte.\n\nEntão deixa algumas coisas para amanhã. Cuida de você. Dorme. Respira. E lembra que existir também é suficiente. Amanhã você continua. Hoje, apenas descanse.`],
['🤍','Abra quando precisar lembrar que é amada',`Você é amada. Não apenas quando está feliz, bonita, forte ou sorrindo. Também quando está confusa, cansada, insegura, quieta ou tendo um dia péssimo.\n\nEu quero conhecer todas essas versões suas. Não porque todas sejam fáceis, mas porque todas fazem parte de você.\n\nSe algum dia você esquecer disso, volte para esta carta. E leia quantas vezes precisar.`],
['💭','Abra quando estiver pensando demais',`Nem todo pensamento precisa de uma resposta. Às vezes a nossa cabeça cria problemas que ainda nem existem.\n\nEntão respira e volta para o presente. Não tenta viver amanhã hoje. O que tiver que acontecer, nós enfrentaremos quando chegar.\n\nPor enquanto, fica aqui. Neste momento. E lembra que você não está sozinha.`],
['🫂','Abra quando quiser um abraço meu',`Eu queria que essa carta pudesse sair da tela e virar um abraço de verdade.\n\nUm daqueles abraços demorados, em que ninguém precisa falar nada. Só ficar ali.\n\nEntão imagina que eu estou te abraçando agora. E que, por alguns segundos, todos os problemas podem esperar.`],
['🌙','Abra antes de dormir em um dia difícil',`Antes de dormir, deixa o que aconteceu hoje para trás por alguns minutos.\n\nVocê fez o que conseguiu com aquilo que tinha. E isso já é alguma coisa. Amanhã você terá uma nova oportunidade de tentar novamente.\n\nQue seu coração encontre descanso esta noite. Dorme em paz, minha princesa. Amanhã a gente continua.`],
['💌','Abra quando quiser saber o que eu sinto por você',`Talvez eu nunca consiga colocar exatamente em palavras tudo aquilo que sinto. Às vezes eu tento escrever e ainda parece pouco.\n\nMas se existe uma coisa que eu quero que você saiba, é que você se tornou alguém muito importante para mim. Eu amo seus detalhes, suas manias, seu jeito, suas conquistas e até aquelas pequenas coisas que você provavelmente nem percebe.\n\nE mais do que imaginar grandes momentos, eu gosto de imaginar a gente vivendo os pequenos. Porque, no fim, são eles que fazem uma história ser nossa.`],
['🙏','Abra quando precisar lembrar da nossa promessa',`Lembra da nossa promessa?\n\nEla nunca foi sobre pressa. Nunca foi sobre obrigar o futuro a acontecer exatamente como imaginamos. É sobre guardar no coração aquilo que sentimos e continuar caminhando com paciência, amor e propósito.\n\nSe algum dia esperar parecer difícil, lembra por que começamos a sonhar. E, acima de tudo, lembra que Deus continua sendo maior do que o nosso tempo.`],
['🕰️','Abra quando sentir que está demorando demais',`Eu sei que esperar pode ser difícil. Principalmente quando existe algo que o coração deseja muito.\n\nMas talvez nem tudo que demora esteja dando errado. Algumas coisas precisam de tempo para amadurecer.\n\nEntão não transforma a espera em medo. Vamos deixar o tempo fazer a parte dele. O que é verdadeiro não precisa ser apressado para existir.`],
['❤️','Abra quando estivermos passando por uma fase difícil',`Se chegamos até esta carta, provavelmente estamos passando por um momento que não imaginávamos.\n\nEntão, antes de qualquer coisa: lembra que nós somos duas pessoas, não dois inimigos. O problema é algo que estamos enfrentando juntos.\n\nVamos conversar antes de desistir. Vamos ouvir antes de responder. Vamos lembrar do amor antes do orgulho. E, se precisarmos de tempo, vamos dar tempo sem transformar distância em abandono.\n\nUma fase difícil não apaga tudo o que vivemos.`],
['💍','Abra quando estivermos vivendo um sonho que um dia só imaginamos',`Olha onde chegamos.\n\nTalvez um dia a gente tenha imaginado exatamente este momento sem saber se ele realmente aconteceria. E agora estamos aqui.\n\nQuero que você pare por alguns segundos e olhe para tudo o que construímos. Para cada espera, cada conversa, cada dificuldade e cada pequeno momento que nos trouxe até aqui.\n\nSe um dia você ler isso vivendo aquilo que hoje chamamos de sonho, lembra: nós já fomos duas pessoas que só podiam imaginar. E, de alguma forma, continuamos escrevendo a nossa história.`]
];
const future=['🔒','Não abra ainda',`Se você chegou até aqui, significa que o tempo passou.\n\nEsta carta não foi escrita para o nosso presente. Ela foi escrita para uma versão futura de nós dois — uma versão que já viveu coisas que hoje só conseguimos imaginar.\n\nTalvez quando você estiver lendo isso, muita coisa tenha mudado. Talvez tenhamos realizado sonhos que pareciam distantes. Talvez a vida tenha nos surpreendido de maneiras que jamais conseguiríamos prever.\n\nMas existe uma coisa que eu espero que nunca mude: que, ao ler estas palavras, você consiga olhar para trás e lembrar de duas pessoas que um dia sonharam, esperaram, tiveram medo, continuaram acreditando e decidiram guardar uma promessa no coração.\n\nSe você abriu esta carta no momento certo, então pare um pouco. Olhe para nós. Olhe para tudo que aconteceu. E lembre de como era quando este futuro ainda era apenas um sonho.\n\nCom carinho,\na versão de mim que ainda estava esperando para descobrir o que o futuro escreveria sobre nós.`];
const grid=document.getElementById('grid'),overlay=document.getElementById('overlay'),emoji=document.getElementById('emoji'),title=document.getElementById('title'),message=document.getElementById('message');
function openLetter(x){emoji.textContent=x[0];title.textContent=x[1];message.textContent=x[2];overlay.classList.add('open')}
letters.forEach(x=>{const b=document.createElement('button');b.className='card';b.type='button';b.innerHTML=`<div class="emoji">${x[0]}</div><strong>${x[1]}</strong><span>Uma mensagem para este momento.</span>`;b.onclick=()=>openLetter(x);grid.appendChild(b)});
document.getElementById('future').onclick=()=>openLetter(future);document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open')});
</script></body></html>
